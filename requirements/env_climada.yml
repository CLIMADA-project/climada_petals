name: climada_env_base
channels:
  - conda-forge
  - nodefaults
dependencies:
  - cdsapi>=0.7
  - libgdal>=3.12,<3.13
  - lxml>=6.1
  - meson>=1.4,<1.5  # meson >=1.5 may break geoclaw setup (at least for python 3.11)
  - meson-python>=0.18
  - osm-flex>=1.1
  - overpy>=0.7
  - rioxarray>=0.19
  - ruamel.yaml>=0.18
  - scikit-image>=0.25
  - pip:
    - boario>=0.6.2
    - country-converter>=0.8  # implicitly required by pymrio
    - progressbar2>=4.2  # implicitly required by boario
    - pymrio>=0.7
